name: Build textbook

# Compiles textbook/main.tex to PDF. Every run uploads the PDF as a workflow
# artifact; pushing a tag named textbook-v* also attaches it to a GitHub release.

on:
  push:
    paths:
      - 'textbook/**'
      - '.github/workflows/textbook.yml'
    tags:
      - 'textbook-v*'
  pull_request:
    paths:
      - 'textbook/**'
      - '.github/workflows/textbook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: textbook

      - name: Collect PDF
        run: cp textbook/build/main.pdf memory-in-llms-textbook.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: memory-in-llms-textbook
          path: memory-in-llms-textbook.pdf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/textbook-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memory-in-llms-textbook

      - uses: softprops/action-gh-release@v2
        with:
          files: memory-in-llms-textbook.pdf
